# GitHub Pages cannot be switched off on a repository named <org>.github.io,
# so the Pages site only serves a redirect to the production domain.
name: Pages redirect

on:
  push:
    branches: [main]
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/pages-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
